<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Guest Chess</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#07131d;
  color:#eef3f7;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
}

button{
  border:0;
  cursor:pointer;
  color:#fff;
  font-weight:700;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.top{
  padding:18px 20px 14px;
  border-bottom:1px solid #263746;
  background:#071721;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:27px;
  font-weight:800;
}

.sub{
  color:#aebbc5;
  margin-top:3px;
}

.status{
  float:right;
  margin-top:-42px;
  font-size:17px;
}

.statusDot{
  display:inline-block;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#f6a313;
  vertical-align:-3px;
  margin-right:7px;
}

.status.online .statusDot{
  background:#19d979;
}

.status.error .statusDot{
  background:#ff4b55;
}

.container{
  max-width:1450px;
  margin:auto;
  padding:18px;
}

.layout{
  display:grid;
  grid-template-columns:minmax(560px,700px) 330px;
  gap:16px;
  align-items:start;
}

.card{
  background:#0a1b27;
  border:1px solid #253949;
  border-radius:15px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 4px 20px rgba(0,0,0,.18);
}

.gameHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.title{
  font-size:24px;
  font-weight:800;
}

.controls{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.timeBtn{
  background:#172d40;
  border:1px solid #30485b;
  border-radius:10px;
  padding:10px 18px;
  font-size:17px;
}

.timeBtn.active{
  background:#1686f5;
  border-color:#43a5ff;
}

.boardWrap{
  width:100%;
  max-width:680px;
  margin:14px auto 12px;
  padding:5px;
  border:2px solid #344b5d;
  border-radius:9px;
  background:#09131b;
}

.board{
  width:100%;
  aspect-ratio:1/1;
  display:grid;
  grid-template-columns:repeat(8,1fr);
  overflow:hidden;
  border-radius:4px;
}

.square{
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}

.light{
  background:#eeeed2;
}

.dark{
  background:#769656;
}

.square.selected{
  box-shadow:inset 0 0 0 5px rgba(255,214,0,.85);
}

.square.legal::after{
  content:"";
  position:absolute;
  width:25%;
  aspect-ratio:1;
  border-radius:50%;
  background:rgba(0,0,0,.28);
}

.square.capture::after{
  content:"";
  position:absolute;
  inset:7%;
  border:5px solid rgba(180,30,30,.60);
  border-radius:50%;
}

.piece{
  position:relative;
  z-index:2;
  font-size:clamp(34px,7vw,66px);
  line-height:1;
  font-family:"Arial Unicode MS","Segoe UI Symbol",serif;
}

.whitePiece{
  color:#fff;
  text-shadow:
    -2px -2px 0 #111,
     2px -2px 0 #111,
    -2px  2px 0 #111,
     2px  2px 0 #111,
     0 3px 4px rgba(0,0,0,.65);
}

.blackPiece{
  color:#15191d;
  text-shadow:
    0 2px 2px rgba(255,255,255,.28),
    0 3px 4px rgba(0,0,0,.7);
}

.clocks{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:8px;
}

.clock{
  background:#07131d;
  border:2px solid #273d4f;
  border-radius:10px;
  padding:8px 12px;
  text-align:center;
}

.clockName{
  color:#a9b8c4;
  font-size:13px;
}

.clockTime{
  font-size:30px;
  font-family:monospace;
  font-weight:800;
}

.clock.active{
  border-color:#24a0ff;
}

.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:10px;
}

.action{
  padding:12px 7px;
  border-radius:9px;
  background:#183247;
}

.action.blue{
  background:#1678dc;
}

.action.red{
  background:#a8273c;
}

.action.green{
  background:#198754;
}

.action.gray{
  background:#293d4d;
}

.sectionTitle{
  font-size:21px;
  font-weight:800;
  margin-bottom:10px;
}

.myid{
  color:#aebbc5;
  margin-top:-4px;
  margin-bottom:8px;
}

.player{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:7px;
  padding:10px;
  background:#07131d;
  border:1px solid #243b4d;
  border-radius:10px;
  margin-bottom:7px;
}

.playerName{
  font-weight:800;
}

.playerState{
  color:#8ea0ad;
  font-size:12px;
}

.challenge{
  background:#1686f5;
  border-radius:8px;
  padding:8px 11px;
}

.empty{
  color:#83939f;
  padding:8px 0;
}

.req{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:7px;
  background:#07131d;
  border:1px solid #263e50;
  border-radius:10px;
  padding:9px;
  margin-bottom:7px;
}

.reqBtns{
  display:flex;
  gap:5px;
}

.accept{
  background:#198754;
  padding:8px 9px;
  border-radius:7px;
}

.decline{
  background:#a8273c;
  padding:8px 9px;
  border-radius:7px;
}

.chatBox{
  height:220px;
  overflow-y:auto;
  background:#07131d;
  border:1px solid #263c4d;
  border-radius:10px;
  padding:9px;
}

.msg{
  margin-bottom:8px;
}

.msgName{
  color:#6fc1ff;
  font-size:12px;
  font-weight:700;
}

.msgText{
  background:#142b3b;
  border-radius:8px;
  padding:7px 9px;
  display:inline-block;
  max-width:90%;
  word-break:break-word;
}

.chatInput{
  display:flex;
  gap:6px;
  margin-top:7px;
}

.chatInput input{
  flex:1;
  min-width:0;
  background:#07131d;
  color:#fff;
  border:1px solid #2a4254;
  border-radius:8px;
  padding:11px;
  outline:none;
}

.chatInput button{
  background:#1686f5;
  padding:0 15px;
  border-radius:8px;
}

.voice{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.voice button{
  background:#183247;
  padding:10px 13px;
  border-radius:8px;
}

.voiceStatus{
  width:100%;
  color:#91a3af;
  font-size:13px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  background:#172d3d;
  border:1px solid #416075;
  padding:11px 16px;
  border-radius:9px;
  z-index:9999;
  display:none;
  max-width:90%;
  text-align:center;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:5000;
  padding:20px;
}

.modalBox{
  background:#0b1e2b;
  border:1px solid #385166;
  border-radius:15px;
  padding:20px;
  width:min(400px,100%);
  text-align:center;
}

.promoBtns{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:15px;
}

.promoBtns button{
  font-size:30px;
  padding:12px 5px;
  background:#183247;
  border-radius:8px;
}

.gameInfo{
  color:#aebbc5;
  font-size:14px;
  margin-top:4px;
}

@media(max-width:900px){
  .layout{
    grid-template-columns:1fr;
  }

  .container{
    padding:8px;
  }

  .boardWrap{
    max-width:none;
  }

  .piece{
    font-size:clamp(30px,9vw,58px);
  }
}

@media(max-width:600px){
  .top{
    padding:14px;
  }

  .brand{
    font-size:22px;
  }

  .status{
    float:none;
    margin:7px 0 0;
  }

  .container{
    padding:5px;
  }

  .card{
    border-radius:11px;
    padding:10px;
  }

  .actions{
    grid-template-columns:repeat(2,1fr);
  }

  .clockTime{
    font-size:25px;
  }

  .timeBtn{
    padding:9px 15px;
  }
}
</style>
</head>

<body>

<header class="top">
  <div class="brand">♟ Guest Chess</div>
  <div class="sub">Play • Talk • Make Friends</div>

  <div id="status" class="status connecting">
    <span class="statusDot"></span>
    <span id="statusText">Connecting...</span>
  </div>
</header>

<main class="container">

<div class="layout">

<!-- GAME -->
<div>

<div class="card">

  <div class="gameHeader">
    <div>
      <div class="title">♟ Chess</div>
      <div class="gameInfo" id="gameInfo">
        Choose a time and challenge a player.
      </div>
    </div>

    <div class="controls">
      <button class="timeBtn active" data-time="3+2">3+2</button>
      <button class="timeBtn" data-time="5+0">5</button>
      <button class="timeBtn" data-time="10+0">10</button>
    </div>
  </div>

  <div class="boardWrap">
    <div id="board" class="board"></div>
  </div>

  <div class="clocks">
    <div id="whiteClock" class="clock active">
      <div class="clockName">WHITE</div>
      <div id="whiteTime" class="clockTime">3:00</div>
    </div>

    <div id="blackClock" class="clock">
      <div class="clockName">BLACK</div>
      <div id="blackTime" class="clockTime">3:00</div>
    </div>
  </div>

  <div class="actions">
    <button id="drawBtn" class="action blue" disabled>Offer Draw</button>
    <button id="resignBtn" class="action red" disabled>Resign</button>
    <button id="leaveBtn" class="action gray" disabled>Leave</button>
    <button id="voiceBtn" class="action green" disabled>🎙 Voice</button>
  </div>

</div>

<!-- CHAT -->
<div class="card">

  <div class="sectionTitle">💬 Chat</div>

  <div id="chatBox" class="chatBox">
    <div class="empty">Start a game to chat.</div>
  </div>

  <div class="chatInput">
    <input id="chatInput" type="text" maxlength="300"
           placeholder="Write a message..." disabled>
    <button id="sendChat" disabled>Send</button>
  </div>

</div>

</div>


<!-- SIDE -->
<div>

<!-- ONLINE -->
<div class="card">

  <div class="sectionTitle">
    🟢 Online
    <span id="onlineCount"
          style="float:right;background:#172d40;padding:5px 10px;border-radius:15px;font-size:14px;">
      0
    </span>
  </div>

  <div class="myid">
    Your ID: <b id="myId">—</b>
  </div>

  <div id="players">
    <div class="empty">Connecting...</div>
  </div>

</div>


<!-- REQUESTS -->
<div class="card">

  <div class="sectionTitle">
    🔔 Requests
    <span id="reqCount"
          style="float:right;background:#172d40;padding:5px 10px;border-radius:15px;font-size:14px;">
      0
    </span>
  </div>

  <div id="requests">
    <div class="empty">No pending requests.</div>
  </div>

</div>


<!-- VOICE -->
<div class="card">

  <div class="sectionTitle">🎙 Voice Chat</div>

  <div class="voice">

    <button id="startVoice">🎙 Enable Voice</button>
    <button id="muteVoice">🔇 Mute</button>

    <div id="voiceStatus" class="voiceStatus">
      Voice is off.
    </div>

  </div>

  <audio id="remoteAudio"
         autoplay
         playsinline
         controls
         style="width:100%;margin-top:8px;display:none;">
  </audio>

</div>

</div>

</div>
</main>


<!-- PROMOTION -->
<div id="promoModal" class="modal">

  <div class="modalBox">

    <div style="font-size:22px;font-weight:800;">
      Choose Promotion
    </div>

    <div class="promoBtns">
      <button data-piece="q">♕</button>
      <button data-piece="r">♖</button>
      <button data-piece="b">♗</button>
      <button data-piece="n">♘</button>
    </div>

  </div>

</div>


<div id="toast" class="toast"></div>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  set,
  update,
  onValue,
  onDisconnect,
  push,
  get,
  remove
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyBF6ybzGbHicPTfuDkx6OUacL_5e5OA8kc",
  authDomain: "walkie-talkie-718d3.firebaseapp.com",
  databaseURL: "https://walkie-talkie-718d3-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "walkie-talkie-718d3",
  storageBucket: "walkie-talkie-718d3.firebasestorage.app",
  messagingSenderId: "1066998245388",
  appId: "1:1066998245388:web:f6076fc04f262373766629",
  measurementId: "G-VHM5LXX06Z"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);


/* =========================================================
   CHESS.JS
========================================================= */

const chessScript = document.createElement("script");

chessScript.src =
  "https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js";

document.head.appendChild(chessScript);


/* =========================================================
   VARIABLES
========================================================= */

let uid = null;
let myId = null;

let chess = null;

let gameId = null;
let color = null;

let opponentUid = null;
let opponentId = null;

let selected = null;

let selectedTime = "3+2";

let baseSeconds = 180;

let whiteSec = 180;
let blackSec = 180;

let lastServerTick = Date.now();

let timerHandle = null;
let gameUnsub = null;
let chatUnsub = null;

let currentGameData = null;

let pendingPromotion = null;

let voicePC = null;
let localStream = null;
let voiceStarted = false;
let voiceMuted = false;

let processedCandidates = new Set();


/* =========================================================
   HELPERS
========================================================= */

const $ = id => document.getElementById(id);

function esc(v){

  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function toast(message){

  const t = $("toast");

  t.textContent = message;
  t.style.display = "block";

  clearTimeout(toast._timer);

  toast._timer = setTimeout(()=>{
    t.style.display = "none";
  },3000);
}


/* =========================================================
   CHESS WAIT
========================================================= */

function waitChess(){

  return new Promise(resolve=>{

    if(window.Chess){
      resolve();
      return;
    }

    const timer = setInterval(()=>{

      if(window.Chess){
        clearInterval(timer);
        resolve();
      }

    },50);

  });
}


/* =========================================================
   PIECES
========================================================= */

const pieceUnicode = {

  w:{
    p:"♙",
    n:"♘",
    b:"♗",
    r:"♖",
    q:"♕",
    k:"♔"
  },

  b:{
    p:"♟",
    n:"♞",
    b:"♝",
    r:"♜",
    q:"♛",
    k:"♚"
  }

};


/* =========================================================
   STATUS
========================================================= */

function setStatus(text,type){

  const s = $("status");

  s.className = "status " + type;

  $("statusText").textContent = text;
}


/* =========================================================
   TIME CONTROL
========================================================= */

document.querySelectorAll(".timeBtn").forEach(btn=>{

  btn.addEventListener("click",()=>{

    if(gameId){
      toast("Finish the current game first.");
      return;
    }

    document.querySelectorAll(".timeBtn")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    selectedTime = btn.dataset.time;

    updatePreviewClock();

  });

});


function updatePreviewClock(){

  const sec =
    selectedTime === "3+2"
      ? 180
      : selectedTime === "10+0"
        ? 600
        : 300;

  $("whiteTime").textContent = formatTime(sec);
  $("blackTime").textContent = formatTime(sec);

}


/* =========================================================
   AUTH
========================================================= */

async function startFirebase(){

  try{

    setStatus("Connecting...","connecting");

    await signInAnonymously(auth);

  }catch(e){

    console.error("Anonymous Auth Error:",e);

    setStatus("Auth Error","error");

    toast(
      "Anonymous login failed: " +
      (e.message || "Check Firebase Authentication")
    );

  }

}


onAuthStateChanged(auth,async user=>{

  try{

    if(!user){

      setStatus("Connecting...","connecting");

      return;
    }

    uid = user.uid;

    myId =
      "Guest-" +
      uid.slice(0,6).toUpperCase();

    $("myId").textContent = myId;

    setStatus("Online","online");

    /* IMPORTANT:
       update instead of set.
       This prevents overwriting game state.
    */

    await update(
      ref(db,`players/${uid}`),
      {
        guestId:myId,
        online:true,
        updatedAt:Date.now()
      }
    );


    await onDisconnect(
      ref(db,`players/${uid}`)
    ).update({
      online:false,
      updatedAt:Date.now()
    });


    /* ONLINE PLAYERS */

    onValue(
      ref(db,"players"),
      snap=>{
        renderPlayers(snap.val() || {});
      }
    );


    /* REQUESTS */

    onValue(
      ref(db,"requests"),
      snap=>{
        renderRequests(snap.val() || {});
      }
    );


    /* ACCEPTED CHALLENGES */

    watchAccepted();


    console.log("Firebase connected:",uid);

  }catch(e){

    console.error("Firebase initialization error:",e);

    setStatus("Firebase Error","error");

    $("myId").textContent = "—";

    toast(
      "Firebase error: " +
      (e.message || "Database permission error")
    );

  }

});


startFirebase();


/* =========================================================
   ONLINE PLAYERS
========================================================= */

function renderPlayers(data){

  const box = $("players");

  box.innerHTML = "";

  const list =
    Object.entries(data)
      .filter(([id,p]) =>
        id !== uid &&
        p &&
        p.online === true
      );


  $("onlineCount").textContent = list.length;


  if(!list.length){

    box.innerHTML =
      '<div class="empty">No other guests online.</div>';

    return;
  }


  list.forEach(([id,p])=>{

    const row = document.createElement("div");

    row.className = "player";

    const left = document.createElement("div");

    left.innerHTML = `
      <div class="playerName">
        🟢 ${esc(p.guestId || "Guest")}
      </div>

      <div class="playerState">
        ${p.inGame ? "In game" : "Available"}
      </div>
    `;


    const button = document.createElement("button");

    button.className = "challenge";

    button.textContent =
      p.inGame ? "Busy" : "Challenge";


    button.disabled =
      !!p.inGame ||
      !!gameId;


    button.onclick = ()=>{
      challenge(id,p.guestId || id);
    };


    row.append(left,button);

    box.appendChild(row);

  });

}


/* =========================================================
   CHALLENGE
========================================================= */

async function challenge(targetUid,targetId){

  try{

    if(!uid || !targetUid){
      toast("Not connected.");
      return;
    }

    if(targetUid === uid){
      toast("You cannot challenge yourself.");
      return;
    }

    if(gameId){
      toast("Finish the current game first.");
      return;
    }


    const r =
      push(ref(db,"requests"));


    await set(r,{

      fromUid:uid,
      fromId:myId,

      toUid:targetUid,
      toId:targetId,

      type:"chess",
      status:"pending",

      timeControl:selectedTime,

      createdAt:Date.now()

    });


    toast(
      `Challenge sent to ${targetId} • ${selectedTime}`
    );

  }catch(e){

    console.error(e);

    toast(
      "Challenge failed: " +
      (e.message || "Database error")
    );

  }

}


/* =========================================================
   REQUESTS
========================================================= */

function renderRequests(data){

  const box = $("requests");

  box.innerHTML = "";


  const list =
    Object.entries(data || {})
      .filter(([,r]) =>
        r &&
        r.status === "pending" &&
        r.toUid === uid
      );


  $("reqCount").textContent = list.length;


  if(!list.length){

    box.innerHTML =
      '<div class="empty">No pending requests.</div>';

    return;
  }


  list.forEach(([rid,r])=>{

    const row = document.createElement("div");

    row.className = "req";


    const left = document.createElement("div");

    left.innerHTML = `
      <div style="font-weight:800">
        ${esc(r.fromId)}
      </div>

      <div style="font-size:12px;color:#92a4b0">
        ${esc(r.timeControl || "5+0")} • chess
      </div>
    `;


    const buttons =
      document.createElement("div");

    buttons.className = "reqBtns";


    const accept =
      document.createElement("button");

    accept.className = "accept";
    accept.textContent = "Accept";

    accept.onclick = ()=>{
      acceptChallenge(rid,r);
    };


    const decline =
      document.createElement("button");

    decline.className = "decline";
    decline.textContent = "Decline";

    decline.onclick = async ()=>{

      await update(
        ref(db,`requests/${rid}`),
        {
          status:"declined"
        }
      );

      toast("Challenge declined.");

    };


    buttons.append(accept,decline);

    row.append(left,buttons);

    box.appendChild(row);

  });

}


/* =========================================================
   ACCEPT CHALLENGE
========================================================= */

async function acceptChallenge(rid,r){

  try{

    if(gameId){
      toast("You are already in a game.");
      return;
    }


    await waitChess();


    const gameRef =
      push(ref(db,"games"));

    const tc =
      r.timeControl || "5+0";


    const sec =
      tc === "3+2"
        ? 180
        : tc === "10+0"
          ? 600
          : 300;


    const initial =
      new Chess();


    await set(gameRef,{

      whiteUid:r.fromUid,
      whiteGuest:r.fromId,

      blackUid:uid,
      blackGuest:myId,

      fen:initial.fen(),
      pgn:"",

      turn:"w",

      status:"playing",

      timeControl:tc,

      whiteTime:sec,
      blackTime:sec,

      lastTick:Date.now(),

      createdAt:Date.now()

    });


    await update(
      ref(db,`requests/${rid}`),
      {
        status:"accepted",
        gameId:gameRef.key
      }
    );


    await update(
      ref(db,`players/${uid}`),
      {
        inGame:true,
        gameId:gameRef.key,
        updatedAt:Date.now()
      }
    );


    joinGame(
      gameRef.key,
      "b",
      r.fromUid,
      r.fromId,
      tc
    );


    toast("Game accepted.");

  }catch(e){

    console.error(e);

    toast(
      "Accept failed: " +
      (e.message || "Database error")
    );

  }

}


/* =========================================================
   WATCH ACCEPTED REQUEST
========================================================= */

function watchAccepted(){

  onValue(
    ref(db,"requests"),
    snap=>{

      const data =
        snap.val() || {};


      Object.entries(data).forEach(([,r])=>{

        if(
          r &&
          r.status === "accepted" &&
          r.gameId &&
          r.fromUid === uid &&
          !gameId
        ){

          joinGame(
            r.gameId,
            "w",
            r.toUid,
            r.toId,
            r.timeControl || "5+0"
          );

        }

      });

    }
  );

}


/* =========================================================
   JOIN GAME
========================================================= */

async function joinGame(
  gid,
  playerColor,
  ou,
  oid,
  tc
){

  await waitChess();


  gameId = gid;
  color = playerColor;

  opponentUid = ou;
  opponentId = oid;

  selected = null;

  selectedTime = tc;


  baseSeconds =
    tc === "3+2"
      ? 180
      : tc === "10+0"
        ? 600
        : 300;


  whiteSec = baseSeconds;
  blackSec = baseSeconds;


  await update(
    ref(db,`players/${uid}`),
    {
      inGame:true,
      gameId:gid,
      updatedAt:Date.now()
    }
  );


  $("drawBtn").disabled = false;
  $("resignBtn").disabled = false;
  $("leaveBtn").disabled = false;
  $("voiceBtn").disabled = false;

  $("chatInput").disabled = false;
  $("sendChat").disabled = false;


  $("gameInfo").textContent =
    `${color === "w" ? "You are White" : "You are Black"} • Opponent: ${opponentId} • ${tc}`;


  chess = new Chess();


  if(gameUnsub){
    gameUnsub();
  }


  gameUnsub =
    onValue(
      ref(db,`games/${gid}`),
      snap=>{

        const g =
          snap.val();


        if(!g){
          return;
        }


        currentGameData = g;


        try{

          chess.load(g.fen);

        }catch(e){

          console.error("FEN error:",e);

          return;
        }


        whiteSec =
          Number(g.whiteTime ?? baseSeconds);

        blackSec =
          Number(g.blackTime ?? baseSeconds);


        lastServerTick =
          Number(g.lastTick || Date.now());


        renderBoard();
        renderClocks();


        if(g.status !== "playing"){

          finishGame(
            g.status,
            false
          );

        }

      }
    );


  if(chatUnsub){
    chatUnsub();
  }


  chatUnsub =
    onValue(
      ref(db,`games/${gid}/chat`),
      snap=>{
        renderChat(snap.val() || {});
      }
    );


  renderBoard();
  renderClocks();

  startTimer();

  initVoice();


  $("chatBox").innerHTML =
    '<div class="empty">No messages yet.</div>';

}


/* =========================================================
   BOARD
========================================================= */

function renderBoard(){

  const board =
    $("board");

  board.innerHTML = "";


  if(!chess){

    return;
  }


  const moves =
    selected
      ? chess.moves({
          square:selected,
          verbose:true
        })
      : [];


  const legal =
    new Map();


  moves.forEach(m=>{
    legal.set(
      m.to,
      m.captured ? "capture" : "legal"
    );
  });


  for(let r=0;r<8;r++){

    for(let c=0;c<8;c++){

      const rr =
        color === "b"
          ? r
          : 7-r;


      const cc =
        color === "b"
          ? 7-c
          : c;


      const squareName =
        String.fromCharCode(97+cc) +
        (8-rr);


      const sq =
        document.createElement("div");


      sq.className =
        "square " +
        ((r+c)%2 === 0
          ? "light"
          : "dark");


      if(selected === squareName){
        sq.classList.add("selected");
      }


      if(legal.has(squareName)){

        sq.classList.add(
          legal.get(squareName)
        );

      }


      const piece =
        chess.get(squareName);


      if(piece){

        const p =
          document.createElement("span");

        p.className =
          "piece " +
          (piece.color === "w"
            ? "whitePiece"
            : "blackPiece");

        p.textContent =
          pieceUnicode[piece.color][piece.type];

        sq.appendChild(p);

      }


      sq.addEventListener(
        "click",
        ()=>squareClick(squareName)
      );


      board.appendChild(sq);

    }

  }

}


/* =========================================================
   SQUARE CLICK
========================================================= */

function squareClick(square){

  if(!chess || !gameId){
    return;
  }


  if(
    currentGameData &&
    currentGameData.status !== "playing"
  ){
    return;
  }


  if(chess.turn() !== color){

    toast("Wait for your turn.");

    return;
  }


  const piece =
    chess.get(square);


  /* Nothing selected */

  if(!selected){

    if(piece && piece.color === color){

      selected = square;

      renderBoard();

    }

    return;
  }


  /* Tap same piece again */

  if(selected === square){

    selected = null;

    renderBoard();

    return;
  }


  /* Tap another own piece */

  if(piece && piece.color === color){

    selected = square;

    renderBoard();

    return;
  }


  /* Check legal move */

  const legal =
    chess.moves({
      square:selected,
      verbose:true
    });


  const move =
    legal.find(
      m=>m.to === square
    );


  if(!move){

    toast("Illegal move.");

    return;
  }


  /* Promotion */

  if(move.flags.includes("p")){

    pendingPromotion = {
      from:selected,
      to:square
    };

    $("promoModal").style.display = "flex";

    return;
  }


  makeMove(
    selected,
    square,
    null
  );

}


/* =========================================================
   PROMOTION
========================================================= */

document.querySelectorAll(
  ".promoBtns button"
).forEach(btn=>{

  btn.addEventListener("click",()=>{

    if(!pendingPromotion){
      return;
    }


    const p =
      btn.dataset.piece;


    const from =
      pendingPromotion.from;

    const to =
      pendingPromotion.to;


    $("promoModal").style.display =
      "none";


    pendingPromotion = null;


    makeMove(
      from,
      to,
      p
    );

  });

});


/* =========================================================
   MAKE MOVE
========================================================= */

async function makeMove(
  from,
  to,
  promotion
){

  if(!chess || !gameId){
    return;
  }


  if(chess.turn() !== color){
    return;
  }


  let move;


  try{

    move =
      chess.move({
        from,
        to,
        promotion:promotion || "q"
      });

  }catch(e){

    toast("Illegal move.");

    return;
  }


  if(!move){

    toast("Illegal move.");

    return;
  }


  selected = null;


  let w =
    Number(
      currentGameData?.whiteTime ??
      whiteSec
    );


  let b =
    Number(
      currentGameData?.blackTime ??
      blackSec
    );


  /*
    Add 2 seconds after the move
    in 3+2.
  */

  if(selectedTime === "3+2"){

    if(color === "w"){
      w += 2;
    }else{
      b += 2;
    }

  }


  const gameOver =
    chess.isGameOver();


  let status = "playing";


  if(chess.isCheckmate()){

    status =
      color === "w"
        ? "white_win"
        : "black_win";

  }
  else if(
    chess.isDraw() ||
    chess.isStalemate() ||
    chess.isThreefoldRepetition() ||
    chess.isInsufficientMaterial()
  ){

    status = "draw";

  }


  await update(
    ref(db,`games/${gameId}`),
    {

      fen:chess.fen(),

      pgn:chess.pgn(),

      turn:chess.turn(),

      whiteTime:w,

      blackTime:b,

      lastTick:Date.now(),

      status

    }
  );

}


/* =========================================================
   CLOCK
========================================================= */

function formatTime(sec){

  sec = Math.max(0,Math.floor(sec));

  const m =
    Math.floor(sec/60);

  const s =
    sec % 60;

  return (
    m +
    ":" +
    String(s).padStart(2,"0")
  );

}


function renderClocks(){

  $("whiteTime").textContent =
    formatTime(whiteSec);

  $("blackTime").textContent =
    formatTime(blackSec);


  $("whiteClock")
    .classList.toggle(
      "active",
      chess &&
      chess.turn() === "w"
    );


  $("blackClock")
    .classList.toggle(
      "active",
      chess &&
      chess.turn() === "b"
    );

}


function startTimer(){

  clearInterval(timerHandle);


  timerHandle =
    setInterval(async()=>{

      if(
        !gameId ||
        !chess ||
        !currentGameData ||
        currentGameData.status !== "playing"
      ){

        return;

      }


      const now =
        Date.now();


      const elapsed =
        Math.max(
          0,
          (now -
            Number(
              currentGameData.lastTick ||
              now
            )
          ) / 1000
        );


      let w =
        Number(
          currentGameData.whiteTime ??
          baseSeconds
        );


      let b =
        Number(
          currentGameData.blackTime ??
          baseSeconds
        );


      if(chess.turn() === "w"){

        w =
          Math.max(
            0,
            w-elapsed
          );

      }else{

        b =
          Math.max(
            0,
            b-elapsed
          );

      }


      whiteSec = w;
      blackSec = b;


      renderClocks();


      /*
        Only update timeout when
        the displayed side reaches zero.
      */

      if(w <= 0 || b <= 0){

        const status =
          w <= 0
            ? "black_win_timeout"
            : "white_win_timeout";


        await update(
          ref(db,`games/${gameId}`),
          {
            whiteTime:w,
            blackTime:b,
            lastTick:now,
            status
          }
        );

      }

    },250);

}


/* =========================================================
   GAME FINISH
========================================================= */

function finishGame(status,write){

  clearInterval(timerHandle);


  $("drawBtn").disabled = true;
  $("resignBtn").disabled = true;
  $("voiceBtn").disabled = false;


  let message = "";


  if(status === "white_win"){
    message = "White wins by checkmate.";
  }
  else if(status === "black_win"){
    message = "Black wins by checkmate.";
  }
  else if(status === "draw"){
    message = "Game drawn.";
  }
  else if(status === "white_win_timeout"){
    message = "White wins on time.";
  }
  else if(status === "black_win_timeout"){
    message = "Black wins on time.";
  }
  else if(status === "white_resign"){
    message = "Black wins — White resigned.";
  }
  else if(status === "black_resign"){
    message = "White wins — Black resigned.";
  }
  else{
    message = "Game finished.";
  }


  toast(message);

  $("gameInfo").textContent =
    message +
    " • Opponent: " +
    opponentId;

}

function renderChat(data){

  const box =
    $("chatBox");


  box.innerHTML = "";


  const list =
    Object.values(data || {})
      .sort(
        (a,b)=>
          Number(a.time||0) -
          Number(b.time||0)
      );


  if(!list.length){

    box.innerHTML =
      '<div class="empty">No messages yet.</div>';

    return;
  }


  list.forEach(m=>{

    const div =
      document.createElement("div");

    div.className = "msg";


    div.innerHTML = `
      <div class="msgName">
        ${esc(m.guestId || "Guest")}
      </div>

      <div class="msgText">
        ${esc(m.text)}
      </div>
    `;


    box.appendChild(div);

  });


  box.scrollTop =
    box.scrollHeight;

}

/* =========================================================
   VOICE CHAT
========================================================= */

async function initVoice(){

  /*
    We do not automatically request microphone
    permission because mobile browsers often
    require a user gesture.
  */

  $("voiceStatus").textContent =
    "Tap Enable Voice to start voice chat.";

}


async function createVoiceConnection(){

  if(!gameId){
    return;
  }


  if(voicePC){
    return voicePC;
  }


  voicePC =
    new RTCPeerConnection({

      iceServers:[
        {
          urls:"stun:stun.l.google.com:19302"
        },
        {
          urls:"stun:stun1.l.google.com:19302"
        }
      ]

    });


  voicePC.onicecandidate =
  async event=>{

    if(!event.candidate){
      return;
    }


    const key =
      push(
        ref(
          db,
          `games/${gameId}/voice/candidates/${uid}`
        )
      ).key;


    await set(
      ref(
        db,
        `games/${gameId}/voice/candidates/${uid}/${key}`
      ),
      event.candidate.toJSON()
    );

  };


  voicePC.ontrack =
  event=>{

    const audio =
      $("remoteAudio");


    audio.style.display =
      "block";


    audio.srcObject =
      event.streams[0];


    audio.muted = false;
    audio.volume = 1;


    audio.play()
      .catch(()=>{
        $("voiceStatus").textContent =
          "Tap the audio player to start sound.";
      });

  };


  if(localStream){

    localStream
      .getTracks()
      .forEach(track=>{
        voicePC.addTrack(
          track,
          localStream
        );
      });

  }


  /* Watch opponent candidates */

  onValue(
    ref(
      db,
      `games/${gameId}/voice/candidates/${opponentUid}`
    ),
    async snap=>{

      const data =
        snap.val() || {};


      for(
        const [key,candidate]
        of Object.entries(data)
      ){

        const unique =
          opponentUid + ":" + key;


        if(processedCandidates.has(unique)){
          continue;
        }


        processedCandidates.add(unique);


        try{

          await voicePC.addIceCandidate(
            new RTCIceCandidate(candidate)
          );

        }catch(e){

          console.warn(
            "ICE candidate error",
            e
          );

        }

      }

    }
  );


  return voicePC;

}


async function startVoice(){

  if(!gameId){

    toast("Start a game first.");

    return;
  }


  try{

    if(!navigator.mediaDevices ||
       !navigator.mediaDevices.getUserMedia){

      toast("Microphone is not supported.");

      return;
    }


    if(!localStream){

      localStream =
        await navigator.mediaDevices.getUserMedia({

          audio:{
            echoCancellation:true,
            noiseSuppression:true,
            autoGainControl:true
          },

          video:false

        });

    }


    const pc =
      await createVoiceConnection();


    voiceStarted = true;


    $("voiceStatus").textContent =
      "Voice enabled. Connecting...";


    /*
      White creates offer.
      Black waits for offer.
    */

    if(color === "w"){

      const offer =
        await pc.createOffer();


      await pc.setLocalDescription(
        offer
      );


      await set(
        ref(
          db,
          `games/${gameId}/voice/offer`
        ),
        {
          type:offer.type,
          sdp:offer.sdp
        }
      );


      onValue(
        ref(
          db,
          `games/${gameId}/voice/answer`
        ),
        async snap=>{

          const answer =
            snap.val();


          if(
            answer &&
            !pc.currentRemoteDescription
          ){

            try{

              await pc.setRemoteDescription(
                new RTCSessionDescription(answer)
              );


              $("voiceStatus").textContent =
                "Voice connected.";

            }catch(e){

              console.error(e);

            }

          }

        }
      );

    }
    else{

      onValue(
        ref(
          db,
          `games/${gameId}/voice/offer`
        ),
        async snap=>{

          const offer =
            snap.val();


          if(
            offer &&
            !pc.currentRemoteDescription
          ){

            try{

              await pc.setRemoteDescription(
                new RTCSessionDescription(offer)
              );


              const answer =
                await pc.createAnswer();


              await pc.setLocalDescription(
                answer
              );


              await set(
                ref(
                  db,
                  `games/${gameId}/voice/answer`
                ),
                {
                  type:answer.type,
                  sdp:answer.sdp
                }
              );


              $("voiceStatus").textContent =
                "Voice connected.";

            }catch(e){

              console.error(e);

            }

          }

        }
      );

    }

  }catch(e){

    console.error(
      "Voice error:",
      e
    );


    $("voiceStatus").textContent =
      "Microphone error: " +
      (e.message || "Permission denied");


    toast(
      "Allow microphone permission."
    );

  }

}


async function stopVoice(){

  try{

    if(localStream){

      localStream
        .getTracks()
        .forEach(t=>t.stop());

    }

    localStream = null;


    if(voicePC){

      voicePC.close();

    }

    voicePC = null;

    voiceStarted = false;


    $("voiceStatus").textContent =
      "Voice is off.";


    $("remoteAudio").srcObject =
      null;


    $("remoteAudio").style.display =
      "none";

  }catch(e){

    console.error(e);

  }

}


$("startVoice").onclick =
startVoice;


$("voiceBtn").onclick =
startVoice;


$("muteVoice").onclick =
()=>{

  if(!localStream){

    toast("Voice is not enabled.");

    return;
  }


  voiceMuted =
    !voiceMuted;


  localStream
    .getAudioTracks()
    .forEach(t=>{
      t.enabled =
        !voiceMuted;
    });


  $("muteVoice").textContent =
    voiceMuted
      ? "🔊 Unmute"
      : "🔇 Mute";

};
