<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Guest Chess</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#111827;
  color:#fff;
}

button{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:bold;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.app{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:12px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
  flex-wrap:wrap;
}

h1{
  margin:0;
  font-size:24px;
}

.connection{
  font-size:13px;
  padding:6px 10px;
  border-radius:20px;
  background:#374151;
}

.connection.online{
  background:#166534;
}

.connection.error{
  background:#991b1b;
}

.layout{
  display:grid;
  grid-template-columns:minmax(300px,680px) 300px;
  gap:14px;
  align-items:start;
}

.game-panel,
.side-panel{
  background:#1f2937;
  border-radius:12px;
  padding:12px;
}

.player-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  background:#111827;
  padding:9px 12px;
  border-radius:8px;
  margin-bottom:8px;
}

.player-name{
  font-weight:bold;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.timer{
  font-family:monospace;
  font-size:20px;
  font-weight:bold;
  min-width:70px;
  text-align:right;
}

.timer.low{
  color:#f87171;
}

.board-wrap{
  width:100%;
  max-width:680px;
  margin:auto;
  position:relative;
}

#board{
  width:100%;
  aspect-ratio:1/1;
  display:grid;
  grid-template-columns:repeat(8,1fr);
  border-radius:4px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(0,0,0,.35);
}

.square{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  aspect-ratio:1/1;
  cursor:pointer;
  user-select:none;
}

.square.light{
  background:#eeeed2;
}

.square.dark{
  background:#769656;
}

.square.selected{
  box-shadow:inset 0 0 0 5px rgba(255,215,0,.75);
}

.square.legal::after{
  content:"";
  width:24%;
  height:24%;
  border-radius:50%;
  background:rgba(0,0,0,.25);
  position:absolute;
}

.square.capture::after{
  content:"";
  position:absolute;
  width:76%;
  height:76%;
  border-radius:50%;
  border:5px solid rgba(0,0,0,.28);
}

.piece{
  position:relative;
  z-index:2;
  font-family:"Arial Unicode MS","Segoe UI Symbol",serif;
  font-size:clamp(32px,8vw,68px);
  line-height:1;
  user-select:none;
  pointer-events:none;
}

.whitePiece{
  color:#fff;
  text-shadow:
    -1px -1px 0 #000,
     1px -1px 0 #000,
    -1px  1px 0 #000,
     1px  1px 0 #000,
     0 2px 2px rgba(0,0,0,.5);
}

.blackPiece{
  color:#111;
  text-shadow:
    0 1px 1px rgba(255,255,255,.45),
    0 2px 2px rgba(0,0,0,.5);
}

.status{
  text-align:center;
  margin-top:9px;
  min-height:22px;
  font-size:14px;
  color:#d1d5db;
}

.section-title{
  font-size:17px;
  font-weight:bold;
  margin:4px 0 10px;
}

.my-id-box{
  background:#111827;
  border-radius:8px;
  padding:10px;
  margin-bottom:12px;
}

.my-id{
  font-size:16px;
  font-weight:bold;
  color:#86efac;
  word-break:break-all;
}

.time-controls{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.time-btn{
  flex:1;
  background:#374151;
  color:#fff;
}

.time-btn.active{
  background:#16a34a;
}

.guest-list{
  max-height:250px;
  overflow-y:auto;
}

.guest{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  background:#111827;
  padding:9px;
  border-radius:8px;
  margin-bottom:7px;
}

.guest-name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:14px;
}

.challenge-btn{
  background:#2563eb;
  color:white;
  padding:7px 10px;
  font-size:12px;
}

.chat{
  margin-top:14px;
}

.chat-messages{
  height:130px;
  overflow-y:auto;
  background:#111827;
  border-radius:8px;
  padding:8px;
  font-size:13px;
}

.chat-msg{
  margin-bottom:7px;
  word-wrap:break-word;
}

.chat-msg b{
  color:#86efac;
}

.chat-input{
  display:flex;
  gap:6px;
  margin-top:7px;
}

.chat-input input{
  min-width:0;
  flex:1;
  border:0;
  border-radius:7px;
  padding:9px;
  background:#374151;
  color:#fff;
  outline:none;
}

.chat-input button{
  background:#2563eb;
  color:#fff;
}

.voice{
  margin-top:14px;
}

.voice button{
  width:100%;
  background:#7c3aed;
  color:#fff;
}

.voice button.active{
  background:#16a34a;
}

.requests{
  margin-top:14px;
}

.request{
  background:#111827;
  padding:10px;
  border-radius:8px;
  margin-bottom:8px;
}

.request-actions{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.accept{
  flex:1;
  background:#16a34a;
  color:#fff;
}

.decline{
  flex:1;
  background:#dc2626;
  color:#fff;
}

.leave{
  margin-top:10px;
  width:100%;
  background:#dc2626;
  color:#fff;
}

.empty{
  color:#9ca3af;
  font-size:13px;
  padding:8px 0;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
  padding:20px;
}

.modal-box{
  width:100%;
  max-width:330px;
  background:#1f2937;
  padding:18px;
  border-radius:12px;
  text-align:center;
}

.promotion-buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:15px;
}

.promotion-buttons button{
  font-size:28px;
  background:#374151;
  color:#fff;
}

.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:#000;
  color:#fff;
  padding:10px 15px;
  border-radius:8px;
  z-index:2000;
  display:none;
  max-width:90%;
  text-align:center;
  font-size:13px;
}

@media(max-width:800px){
  .layout{
    grid-template-columns:1fr;
  }

  .side-panel{
    order:2;
  }

  .game-panel{
    order:1;
  }

  .app{
    padding:7px;
  }

  h1{
    font-size:20px;
  }

  .piece{
    font-size:clamp(30px,11vw,54px);
  }
}

@media(max-width:420px){
  .player-bar{
    padding:7px 9px;
  }

  .timer{
    font-size:18px;
  }

  .piece{
    font-size:clamp(27px,12vw,48px);
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1>♟ Guest Chess</h1>
  <div id="connection" class="connection">Connecting...</div>
</header>

<div class="layout">

  <!-- GAME -->
  <section class="game-panel">

    <div class="player-bar">
      <div id="opponentId" class="player-name">Opponent</div>
      <div id="opponentTimer" class="timer">--:--</div>
    </div>

    <div class="board-wrap">
      <div id="board"></div>
    </div>

    <div id="gameStatus" class="status">
      Select a player to challenge.
    </div>

    <button id="leaveGameBtn" class="leave" style="display:none;">
      Leave Game
    </button>

    <div class="chat">
      <div class="section-title">Game Chat</div>

      <div id="chatMessages" class="chat-messages">
        <div class="empty">No messages.</div>
      </div>

      <div class="chat-input">
        <input id="chatInput" type="text" maxlength="300" placeholder="Message...">
        <button id="sendChatBtn">Send</button>
      </div>
    </div>

    <div class="voice">
      <button id="voiceBtn">
        🎙️ Enable Voice
      </button>
    </div>

  </section>


  <!-- SIDE -->
  <aside class="side-panel">

    <div class="section-title">Your Guest ID</div>

    <div class="my-id-box">
      <div id="myId" class="my-id">Connecting...</div>
    </div>

    <div class="section-title">Time Control</div>

    <div class="time-controls">
      <button class="time-btn active" data-time="3+2">3+2</button>
      <button class="time-btn" data-time="5+0">5+0</button>
    </div>

    <div class="section-title">Online Guests</div>

    <div id="guestList" class="guest-list">
      <div class="empty">Waiting for guests...</div>
    </div>

    <div class="requests">
      <div class="section-title">Challenges</div>
      <div id="requestList">
        <div class="empty">No challenges.</div>
      </div>
    </div>

  </aside>

</div>
</div>


<!-- PROMOTION -->
<div id="promotionModal" class="modal">
  <div class="modal-box">
    <h3>Promote Pawn</h3>

    <div class="promotion-buttons">
      <button data-piece="q">♛</button>
      <button data-piece="r">♜</button>
      <button data-piece="b">♝</button>
      <button data-piece="n">♞</button>
    </div>
  </div>
</div>


<div id="toast" class="toast"></div>


<!-- CHESS.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  set,
  update,
  onValue,
  onDisconnect,
  push
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyBF6ybzGbHicPTfuDkx6OUAcL_5e5OA8kc",
  authDomain: "walkie-talkie-718d3.firebaseapp.com",
  databaseURL: "https://walkie-talkie-718d3-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "walkie-talkie-718d3",
  storageBucket: "walkie-talkie-718d3.firebasestorage.app",
  messagingSenderId: "1066998245388",
  appId: "1:1066998245388:web:f6076fc04f262373766629",
  measurementId: "G-VHM5LXX06Z"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);


/* =========================================================
   HELPERS
========================================================= */

const $ = id => document.getElementById(id);

let uid = null;
let myId = null;

let selectedTime = "3+2";

let currentGameId = null;
let gameData = null;

let chess = null;

let myColor = null;

let selectedSquare = null;

let promotionMove = null;

let gameListener = null;

let chatListener = null;

let playersListener = null;

let requestsListener = null;

let acceptedGamesListener = null;

let clockInterval = null;

let timeoutWriting = false;

let lastFen = "";

const watchedAcceptedGames = new Set();

const gameUnsubscribers = new Map();


/* =========================================================
   CHESS PIECES
========================================================= */

const pieces = {

  w:{
    p:"♙",
    n:"♘",
    b:"♗",
    r:"♖",
    q:"♕",
    k:"♔"
  },

  b:{
    p:"♟",
    n:"♞",
    b:"♝",
    r:"♜",
    q:"♛",
    k:"♚"
  }

};


/* =========================================================
   UI
========================================================= */

function setConnection(text, type=""){
  const el = $("connection");

  el.textContent = text;

  el.className = "connection";

  if(type){
    el.classList.add(type);
  }
}


function toast(message){

  const el = $("toast");

  el.textContent = message;

  el.style.display = "block";

  clearTimeout(toast.timer);

  toast.timer = setTimeout(()=>{
    el.style.display = "none";
  },2500);
}


/* =========================================================
   TIME CONTROL
========================================================= */

document.querySelectorAll(".time-btn").forEach(btn=>{

  btn.addEventListener("click",()=>{

    if(currentGameId){
      toast("Finish the current game first.");
      return;
    }

    selectedTime = btn.dataset.time;

    document.querySelectorAll(".time-btn")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

  });

});


function initialSeconds(time){

  return time === "3+2" ? 180 : 300;

}


function incrementSeconds(time){

  return time === "3+2" ? 2 : 0;

}


function formatTime(ms){

  ms = Math.max(0, Number(ms || 0));

  const totalSeconds = Math.ceil(ms / 1000);

  const minutes = Math.floor(totalSeconds / 60);

  const seconds = totalSeconds % 60;

  return String(minutes).padStart(2,"0")
    + ":" +
    String(seconds).padStart(2,"0");
}


/* =========================================================
   FIREBASE AUTH
========================================================= */

async function setupUser(user){

  if(!user){
    throw new Error("Firebase user not available.");
  }

  uid = user.uid;

  myId =
    "Guest-" +
    uid.substring(0,6).toUpperCase();

  $("myId").textContent = myId;

  setConnection("Online","online");


  const playerRef =
    ref(db,`players/${uid}`);


  await update(playerRef,{

    guestId:myId,

    online:true,

    inGame:false,

    updatedAt:Date.now()

  });


  onDisconnect(playerRef).update({

    online:false,

    updatedAt:Date.now()

  });


  watchPlayers();

  watchRequests();

  watchAcceptedGames();

}


onAuthStateChanged(auth,async user=>{

  try{

    if(!user){

      setConnection("Connecting...");

      return;

    }

    await setupUser(user);

  }catch(error){

    console.error(error);

    setConnection("Connection Error","error");

    toast(
      error.code
      ? error.code + ": " + error.message
      : error.message
    );

  }

});


async function startFirebase(){

  try{

    setConnection("Connecting...");

    await signInAnonymously(auth);

  }catch(error){

    console.error(error);

    setConnection("Auth Error","error");

    toast(
      error.code
      ? error.code + ": " + error.message
      : error.message
    );

  }

}

startFirebase();


/* =========================================================
   ONLINE PLAYERS
========================================================= */

function watchPlayers(){

  if(playersListener) return;

  playersListener = onValue(
    ref(db,"players"),
    snapshot=>{

      const data = snapshot.val() || {};

      const list = $("guestList");

      list.innerHTML = "";

      const players = Object.entries(data)
        .filter(([playerUid,p])=>
          playerUid !== uid &&
          p &&
          p.online === true &&
          p.inGame !== true
        );

      if(players.length === 0){

        list.innerHTML =
          '<div class="empty">No other guests online.</div>';

        return;

      }


      players.forEach(([playerUid,p])=>{

        const row =
          document.createElement("div");

        row.className = "guest";


        const name =
          document.createElement("div");

        name.className = "guest-name";

        name.textContent =
          p.guestId || "Guest";


        const button =
          document.createElement("button");

        button.className = "challenge-btn";

        button.textContent = "Challenge";


        button.addEventListener("click",()=>{

          sendChallenge(
            playerUid,
            p.guestId || "Guest"
          );

        });


        row.appendChild(name);

        row.appendChild(button);

        list.appendChild(row);

      });

    }
  );

}


/* =========================================================
   SEND CHALLENGE
========================================================= */

async function sendChallenge(targetUid,targetId){

  if(!uid){
    toast("Not connected yet.");
    return;
  }

  if(currentGameId){
    toast("You are already in a game.");
    return;
  }

  if(targetUid === uid){
    return;
  }


  try{

    const requestsSnapshot =
      await new Promise(resolve=>{

        onValue(
          ref(db,"requests"),
          resolve,
          {onlyOnce:true}
        );

      });


    const requests =
      requestsSnapshot.val() || {};

    const duplicate =
      Object.values(requests).some(r=>
        r &&
        r.status === "pending" &&
        r.fromUid === uid &&
        r.toUid === targetUid
      );

    if(duplicate){

      toast("Challenge already sent.");

      return;

    }


    const request =
      push(ref(db,"requests"));


    await set(request,{

      fromUid:uid,

      fromId:myId,

      toUid:targetUid,

      toId:targetId,

      status:"pending",

      timeControl:selectedTime,

      createdAt:Date.now()

    });


    toast("Challenge sent to " + targetId);

  }catch(error){

    console.error(error);

    toast("Could not send challenge.");

  }

}


/* =========================================================
   INCOMING REQUESTS
========================================================= */

function watchRequests(){

  if(requestsListener) return;

  requestsListener = onValue(
    ref(db,"requests"),
    snapshot=>{

      const data = snapshot.val() || {};

      const list = $("requestList");

      list.innerHTML = "";


      const incoming =
        Object.entries(data)
        .filter(([id,r])=>
          r &&
          r.toUid === uid &&
          r.status === "pending"
        );


      if(incoming.length === 0){

        list.innerHTML =
          '<div class="empty">No challenges.</div>';

        return;

      }


      incoming.forEach(([requestId,request])=>{

        const box =
          document.createElement("div");

        box.className = "request";


        const text =
          document.createElement("div");

        text.innerHTML =
          "<b>" +
          escapeHtml(request.fromId || "Guest") +
          "</b> challenged you (" +
          escapeHtml(request.timeControl || "3+2") +
          ")";


        const actions =
          document.createElement("div");

        actions.className = "request-actions";


        const accept =
          document.createElement("button");

        accept.className = "accept";

        accept.textContent = "Accept";


        const decline =
          document.createElement("button");

        decline.className = "decline";

        decline.textContent = "Decline";


        accept.addEventListener("click",()=>{

          acceptChallenge(requestId,request);

        });


        decline.addEventListener("click",()=>{

          declineChallenge(requestId);

        });


        actions.appendChild(accept);

        actions.appendChild(decline);

        box.appendChild(text);

        box.appendChild(actions);

        list.appendChild(box);

      });

    }
  );

}


async function declineChallenge(requestId){

  try{

    await update(
      ref(db,`requests/${requestId}`),
      {
        status:"declined",
        respondedAt:Date.now()
      }
    );

  }catch(error){

    console.error(error);

  }

}


/* =========================================================
   ACCEPT CHALLENGE
========================================================= */

async function acceptChallenge(requestId,request){

  if(currentGameId){

    toast("You are already in a game.");

    return;

  }


  try{

    const challengerWhite =
      Math.random() < 0.5;


    const whiteUid =
      challengerWhite
      ? request.fromUid
      : uid;


    const whiteGuest =
      challengerWhite
      ? request.fromId
      : myId;


    const blackUid =
      challengerWhite
      ? uid
      : request.fromUid;


    const blackGuest =
      challengerWhite
      ? myId
      : request.fromId;


    const timeControl =
      request.timeControl === "5+0"
      ? "5+0"
      : "3+2";


    const seconds =
      initialSeconds(timeControl);


    const initial =
      new Chess();


    const gameRef =
      push(ref(db,"games"));


    await set(gameRef,{

      whiteUid,

      whiteGuest,

      blackUid,

      blackGuest,

      fen:initial.fen(),

      pgn:"",

      turn:"w",

      status:"playing",

      timeControl,

      whiteTime:seconds * 1000,

      blackTime:seconds * 1000,

      lastTick:Date.now(),

      createdAt:Date.now()

    });


    await update(
      ref(db,`requests/${requestId}`),
      {
        status:"accepted",
        gameId:gameRef.key,
        respondedAt:Date.now()
      }
    );


    await update(
      ref(db,`players/${uid}`),
      {
        inGame:true,
        gameId:gameRef.key,
        online:true,
        updatedAt:Date.now()
      }
    );


    joinGame(
      gameRef.key,
      whiteUid === uid ? "w" : "b"
    );


  }catch(error){

    console.error(error);

    toast("Could not start game.");

  }

}


/* =========================================================
   WATCH ACCEPTED GAMES
========================================================= */

function watchAcceptedGames(){

  if(acceptedGamesListener) return;


  acceptedGamesListener = onValue(
    ref(db,"requests"),
    snapshot=>{

      const data = snapshot.val() || {};


      Object.values(data).forEach(request=>{

        if(!request) return;

        if(
          request.status === "accepted" &&
          request.gameId &&
          (
            request.fromUid === uid ||
            request.toUid === uid
          )
        ){

          watchAcceptedGame(request.gameId);

        }

      });

    }
  );

}


function watchAcceptedGame(gameId){

  if(watchedAcceptedGames.has(gameId)){

    return;

  }

  watchedAcceptedGames.add(gameId);


  const unsub = onValue(
    ref(db,`games/${gameId}`),
    snapshot=>{

      const data = snapshot.val();

      if(!data) return;


      if(
        data.whiteUid !== uid &&
        data.blackUid !== uid
      ){

        return;

      }


      const color =
        data.whiteUid === uid ? "w" : "b";


      if(!currentGameId){

        joinGame(gameId,color);

      }

    }
  );


  gameUnsubscribers.set(gameId,unsub);

}


/* =========================================================
   JOIN GAME
========================================================= */

function joinGame(gameId,color){

  if(
    currentGameId === gameId &&
    myColor === color
  ){

    return;

  }


  stopClock();


  currentGameId = gameId;

  myColor = color;

  selectedSquare = null;

  promotionMove = null;

  chess = new Chess();

  $("leaveGameBtn").style.display = "block";


  if(gameListener){

    gameListener();

    gameListener = null;

  }


  gameListener = onValue(
    ref(db,`games/${gameId}`),
    snapshot=>{

      const data = snapshot.val();

      if(!data){

        return;

      }


      gameData = data;


      if(
        !chess ||
        data.fen !== chess.fen()
      ){

        try{

          chess.load(data.fen);

        }catch(error){

          console.error(
            "FEN load error:",
            error
          );

        }

      }


      lastFen = data.fen;


      updateGameUI();

      renderBoard();

      startClock();

      loadChat(gameId);

      setupVoiceListeners();

    }
  );


  update(
    ref(db,`players/${uid}`),
    {
      inGame:true,
      gameId:gameId,
      online:true,
      updatedAt:Date.now()
    }
  ).catch(console.error);

}


/* =========================================================
   GAME UI
========================================================= */

function updateGameUI(){

  if(!gameData || !myColor){

    return;

  }


  const opponentColor =
    myColor === "w" ? "b" : "w";


  const opponentId =
    opponentColor === "w"
    ? gameData.whiteGuest
    : gameData.blackGuest;


  $("opponentId").textContent =
    opponentId || "Opponent";


  const ownId =
    myColor === "w"
    ? gameData.whiteGuest
    : gameData.blackGuest;


  $("myId").textContent =
    ownId || myId;


  $("gameStatus").textContent =

/* =========================================================
   BOARD
========================================================= */

function renderBoard(){

  const board = $("board");

  board.innerHTML = "";


  if(!chess){

    return;

  }


  let legalMoves = [];


  if(selectedSquare){

    legalMoves =
      chess.moves({
        square:selectedSquare,
        verbose:true
      });

  }


  const moveMap = new Map();


  legalMoves.forEach(move=>{

    moveMap.set(
      move.to,
      move.captured
      ? "capture"
      : "legal"
    );

  });


  for(
    let visualRow = 0;
    visualRow < 8;
    visualRow++
  ){

    for(
      let visualCol = 0;
      visualCol < 8;
      visualCol++
    ){

      let boardRow;
      let boardCol;


      /*
        WHITE:
        top-left = a8
        bottom-right = h1

        BLACK:
        top-left = h1
        bottom-right = a8
      */

      if(myColor === "w"){

        boardRow = visualRow;

        boardCol = visualCol;

      }else{

        boardRow = 7 - visualRow;

        boardCol = 7 - visualCol;

      }


      const squareName =
        String.fromCharCode(97 + boardCol) +
        (8 - boardRow);


      const square =
        document.createElement("div");


      square.className =
        "square " +
        (
          (visualRow + visualCol) % 2 === 0
          ? "light"
          : "dark"
        );


      if(selectedSquare === squareName){

        square.classList.add("selected");

      }


      if(moveMap.has(squareName)){

        square.classList.add(
          moveMap.get(squareName)
        );

      }


      const piece =
        chess.get(squareName);


      if(piece){

        const el =
          document.createElement("span");


        el.className =
          "piece " +
          (
            piece.color === "w"
            ? "whitePiece"
            : "blackPiece"
          );


        el.textContent =
          pieces[piece.color][piece.type];


        square.appendChild(el);

      }


      square.addEventListener(
        "click",
        ()=>{
          clickSquare(squareName);
        }
      );


      board.appendChild(square);

    }

  }

}


/* =========================================================
   BOARD CLICK
========================================================= */

function clickSquare(square){

  if(
    !chess ||
    !currentGameId ||
    !gameData ||
    gameData.status !== "playing"
  ){

    return;

  }


  if(chess.turn() !== myColor){

    toast("Wait for your turn.");

    return;

  }


  const piece =
    chess.get(square);


  /*
    Nothing selected:
    select own piece only.
  */

  if(!selectedSquare){

    if(
      piece &&
      piece.color === myColor
    ){

      selectedSquare = square;

      renderBoard();

    }

    return;

  }


  /*
    Same square:
    deselect.
  */

  if(selectedSquare === square){

    selectedSquare = null;

    renderBoard();

    return;

  }


  /*
    Clicking another own piece:
    change selection.
  */

  if(
    piece &&
    piece.color === myColor
  ){

    selectedSquare = square;

    renderBoard();

    return;

  }


  /*
    Check legal move.
  */

  const legalMoves =
    chess.moves({
      square:selectedSquare,
      verbose:true
    });


  const move =
    legalMoves.find(
      m =>
        m.from === selectedSquare &&
        m.to === square
    );


  if(!move){

    toast("Illegal move.");

    return;

  }


  /*
    Pawn promotion.
  */

  if(
    move.flags &&
    move.flags.includes("p")
  ){

    promotionMove = {
      from:selectedSquare,
      to:square
    };


    $("promotionModal").style.display =
      "flex";


    return;

  }


  makeMove(
    selectedSquare,
    square,
    null
  );

}

/* =========================================================
   MAKE MOVE
========================================================= */

async function makeMove(
  from,
  to,
  promotion = null
){

  if(
    !chess ||
    !gameData ||
    !currentGameId
  ){

    return;

  }


  if(
    gameData.status !== "playing"
  ){

    return;

  }


  if(chess.turn() !== myColor){

    toast("Wait for your turn.");

    return;

  }


  const legalMoves =
    chess.moves({
      square:from,
      verbose:true
    });


  const legal =
    legalMoves.find(
      m =>
        m.from === from &&
        m.to === to
    );


  if(!legal){

    toast("Illegal move.");

    selectedSquare = null;

    renderBoard();

    return;

  }


  let move;


  try{

    move =
      chess.move({
        from:from,
        to:to,
        promotion:promotion || "q"
      });

  }catch(error){

    console.error(
      "Move error:",
      error
    );

    toast("Move failed.");

    return;

  }


  if(!move){

    toast("Move failed.");

    return;

  }


  selectedSquare = null;


  /*
    Calculate time used from
    Firebase authoritative lastTick.
  */

  const now = Date.now();


  let whiteRemaining =
    Number(
      gameData.whiteTime || 0
    );


  let blackRemaining =
    Number(
      gameData.blackTime || 0
    );


  const lastTick =
    Number(
      gameData.lastTick || now
    );


  const elapsed =
    Math.max(
      0,
      now - lastTick
    );


  /*
    The player who just moved
    used this elapsed time.
  */

  if(myColor === "w"){

    whiteRemaining -= elapsed;

  }else{

    blackRemaining -= elapsed;

  }


  whiteRemaining =
    Math.max(0,whiteRemaining);

  blackRemaining =
    Math.max(0,blackRemaining);


  /*
    Add increment after move.
  */

  if(
    gameData.timeControl === "3+2"
  ){

    if(myColor === "w"){

      whiteRemaining += 2000;

    }else{

      blackRemaining += 2000;

    }

  }


  let status = "playing";


  /*
    Checkmate.
  */

  if(chess.isCheckmate()){

    status = "checkmate";

  }


  /*
    Stalemate.
  */

  else if(chess.isStalemate()){

    status = "stalemate";

  }


  /*
    Threefold repetition.
  */

  else if(chess.isThreefoldRepetition()){

    status = "draw";

  }


  /*
    Insufficient material.
  */

  else if(chess.isInsufficientMaterial()){

    status = "draw";

  }


  /*
    Time out.
  */

  if(
    whiteRemaining <= 0 ||
    blackRemaining <= 0
  ){

    status = "timeout";

  }


  const newData = {

    ...gameData,

    fen:chess.fen(),

    pgn:chess.pgn(),

    turn:chess.turn(),

    status,

    whiteTime:whiteRemaining,

    blackTime:blackRemaining,

    lastTick:Date.now(),

    lastMove:{
      from,
      to,
      promotion:promotion || null,
      by:uid,
      at:Date.now()
    }

  };


  /*
    Local update first.
    This makes the board respond instantly.
  */

  gameData = newData;

  lastFen = newData.fen;


  updateGameUI();

  renderBoard();


  try{

    await update(
      ref(db,`games/${currentGameId}`),
      {
        fen:newData.fen,
        pgn:newData.pgn,
        turn:newData.turn,
        status:newData.status,
        whiteTime:newData.whiteTime,
        blackTime:newData.blackTime,
        lastTick:newData.lastTick,
        lastMove:newData.lastMove
      }
    );

  }catch(error){

    console.error(error);

    toast("Move sync failed.");

  }

}


/* =========================================================
   GAME STATUS
========================================================= */

function getGameStatusText(){

  if(!gameData){

    return "Waiting...";

  }


  if(gameData.status === "checkmate"){

    const winner =
      chess && chess.turn() === "w"
      ? gameData.blackGuest
      : gameData.whiteGuest;


    return "Checkmate — " +
      winner +
      " wins";

  }


  if(gameData.status === "stalemate"){

    return "Draw — Stalemate";

  }


  if(gameData.status === "draw"){

    return "Draw";

  }


  if(gameData.status === "timeout"){

    const whiteTime =
      Number(gameData.whiteTime || 0);

    const blackTime =
      Number(gameData.blackTime || 0);


    if(whiteTime <= 0){

      return "Time out — " +
        gameData.blackGuest +
        " wins";

    }


    return "Time out — " +
      gameData.whiteGuest +
      " wins";

  }


  if(gameData.status === "left"){

    return "Game ended";

  }


  if(
    chess &&
    chess.in_check()
  ){

    return chess.turn() === myColor
      ? "Check — your move"
      : "Check — opponent's move";

  }


  return chess &&
    chess.turn() === myColor
    ? "Your turn"
    : "Opponent's turn";

}


/* =========================================================
   CLOCK
========================================================= */

function startClock(){

  stopClock();

  timeoutWriting = false;

  updateTimers();


  clockInterval =
    setInterval(
      updateTimers,
      250
    );

}


function stopClock(){

  if(clockInterval){

    clearInterval(clockInterval);

    clockInterval = null;

  }

}


function getCurrentRemaining(color){

  if(!gameData){

    return 0;

  }


  let remaining =
    Number(
      color === "w"
      ? gameData.whiteTime || 0
      : gameData.blackTime || 0
    );


  if(
    gameData.status !== "playing"
  ){

    return Math.max(
      0,
      remaining
    );

  }


  if(
    gameData.turn !== color
  ){

    return Math.max(
      0,
      remaining
    );

  }


  const elapsed =
    Date.now() -
    Number(
      gameData.lastTick || Date.now()
    );


  return Math.max(
    0,
    remaining - elapsed
  );

}


function updateTimers(){

  if(!gameData){

    $("opponentTimer").textContent =
      "--:--";

    return;

  }


  const opponentColor =
    myColor === "w" ? "b" : "w";


  const opponentTime =
    getCurrentRemaining(
      opponentColor
    );


  const ownTime =
    getCurrentRemaining(
      myColor
    );


  $("opponentTimer").textContent =
    formatTime(opponentTime);


  /*
    Own timer is shown using
    my ID area only if game active.
  */

  if(currentGameId){

    const ownTimer =
      document.querySelector(
        ".game-panel .player-bar"
      );

  }


  $("opponentTimer").classList.toggle(
    "low",
    opponentTime <= 10000
  );


  /*
    There is no separate bottom timer
    element in the original structure,
    so create/use one.
  */

  let ownBar =
    document.getElementById(
      "ownPlayerBar"
    );


  if(!ownBar){

    ownBar =
      document.createElement("div");

    ownBar.id =
      "ownPlayerBar";

    ownBar.className =
      "player-bar";

    const board =
      document.querySelector(
        ".board-wrap"
      );


    board.insertAdjacentElement(
      "afterend",
      ownBar
    );

  }


  ownBar.innerHTML =
    `
      <div class="player-name">
        ${escapeHtml(
          myId || "You"
        )}
      </div>
      <div id="ownTimer" class="timer">
        ${formatTime(ownTime)}
      </div>
    `;


  const ownTimer =
    document.getElementById(
      "ownTimer"
    );


  if(ownTimer){

    ownTimer.classList.toggle(
      "low",
      ownTime <= 10000
    );

  }


  /*
    If the active player's clock reaches
    zero, write timeout only once.
  */

  if(
    gameData.status === "playing" &&
    (
      (myColor === "w" && ownTime <= 0) ||
      (myColor === "b" && ownTime <= 0) ||
      (opponentColor === "w" && opponentTime <= 0) ||
      (opponentColor === "b" && opponentTime <= 0)
    )
  ){

    handleTimeout();

  }

}


async function handleTimeout(){

  if(timeoutWriting) return;

  if(!gameData) return;

  if(gameData.status !== "playing") return;


  timeoutWriting = true;


  const now = Date.now();


  let whiteTime =
    Number(gameData.whiteTime || 0);


  let blackTime =
    Number(gameData.blackTime || 0);


  const elapsed =
    now -
    Number(
      gameData.lastTick || now
    );


  if(gameData.turn === "w"){

    whiteTime =
      Math.max(
        0,
        whiteTime - elapsed
      );

  }else{

    blackTime =
      Math.max(
        0,
        blackTime - elapsed
      );

  }


  if(
    whiteTime <= 0 ||
    blackTime <= 0
  ){

    try{

      await update(
        ref(db,`games/${currentGameId}`),
        {
          whiteTime,
          blackTime,
          status:"timeout",
          lastTick:now
        }
      );

    }catch(error){

      console.error(error);

    }

  }


  timeoutWriting = false;

}

function loadChat(gameId){

  if(chatListener){

    chatListener();

    chatListener = null;

  }


  chatListener = onValue(
    ref(db,`games/${gameId}/chat`),
    snapshot=>{

      const data =
        snapshot.val() || {};


      const box =
        $("chatMessages");


      box.innerHTML = "";


      const messages =
        Object.values(data)
        .sort(
          (a,b)=>
            Number(a.time || 0) -
            Number(b.time || 0)
        );


      if(messages.length === 0){

        box.innerHTML =
          '<div class="empty">No messages.</div>';

        return;

      }


      messages.slice(-100).forEach(msg=>{

        const div =
          document.createElement("div");

        div.className =
          "chat-msg";


        div.innerHTML =
          "<b>" +
          escapeHtml(
            msg.fromId || "Guest"
          ) +
          ":</b> " +
          escapeHtml(
            msg.text || ""
          );


        box.appendChild(div);

      });


      box.scrollTop =
        box.scrollHeight;

    }
  );

}


async function sendChat(){

  }catch(error){

  }

}

/* =========================================================
   VOICE CHAT
   Existing WebRTC functionality
========================================================= */

let voiceEnabled = false;

let localStream = null;

let peerConnection = null;

let voiceCandidatesListener = null;

let voiceOfferListener = null;

let voiceAnswerListener = null;


const voiceConfig = {

  iceServers:[
    {
      urls:"stun:stun.l.google.com:19302"
    },
    {
      urls:"stun:stun1.l.google.com:19302"
    }
  ]

};


async function enableVoice(){

  if(!currentGameId){

    toast("Start a game first.");

    return;

  }


  try{

    localStream =
      await navigator.mediaDevices
      .getUserMedia({
        audio:true,
        video:false
      });


    voiceEnabled = true;


    $("voiceBtn").textContent =
      "🎙️ Voice Enabled";


    $("voiceBtn")
      .classList.add("active");


    await createPeerConnection();


  }catch(error){

    console.error(error);

    toast(
      "Microphone permission required."
    );

  }

}


$("voiceBtn")
.addEventListener(
  "click",
  enableVoice
);


async function createPeerConnection(){

  if(!currentGameId || !localStream){

    return;

  }


  if(peerConnection){

    return;

  }


  peerConnection =
    new RTCPeerConnection(
      voiceConfig
    );


  localStream
    .getTracks()
    .forEach(track=>{

      peerConnection.addTrack(
        track,
        localStream
      );

    });


  peerConnection.onicecandidate =
    async event=>{

      if(!event.candidate) return;


      const candidateRef =
        push(
          ref(
            db,
            `games/${currentGameId}/voice/candidates/${uid}`
          )
        );


      await set(
        candidateRef,
        event.candidate.toJSON()
      );

    };


  peerConnection.ontrack =
    event=>{

      let audio =
        document.getElementById(
          "remoteVoice"
        );


      if(!audio){

        audio =
          document.createElement("audio");

        audio.id =
          "remoteVoice";

        audio.autoplay = true;

        document.body.appendChild(audio);

      }


      audio.srcObject =
        event.streams[0];

    };


  /*
    White creates offer.
  */

  if(myColor === "w"){

    const offer =
      await peerConnection.createOffer();


    await peerConnection.setLocalDescription(
      offer
    );


    await set(
      ref(
        db,
        `games/${currentGameId}/voice/offer`
      ),
      {
        type:offer.type,
        sdp:offer.sdp
      }
    );

    watchVoiceAnswer();

  }else{

    watchVoiceOffer();

  }


  watchVoiceCandidates();

}


function watchVoiceOffer(){

  if(voiceOfferListener) return;


  voiceOfferListener =
    onValue(
      ref(
        db,
        `games/${currentGameId}/voice/offer`
      ),
      async snapshot=>{

        const offer =
          snapshot.val();


        if(
          !offer ||
          !peerConnection
        ){

          return;

        }


        if(
          peerConnection
          .currentRemoteDescription
        ){

          return;

        }


        try{

          await peerConnection.setRemoteDescription(
            new RTCSessionDescription(
              offer
            )
          );


          const answer =
            await peerConnection.createAnswer();


          await peerConnection.setLocalDescription(
            answer
          );


          await set(
            ref(
              db,
              `games/${currentGameId}/voice/answer`
            ),
            {
              type:answer.type,
              sdp:answer.sdp
            }
          );

        }catch(error){

          console.error(
            "Voice answer error:",
            error
          );

        }

      }
    );

}


function watchVoiceAnswer(){

  if(voiceAnswerListener) return;


  voiceAnswerListener =
    onValue(
      ref(
        db,
        `games/${currentGameId}/voice/answer`
      ),
      async snapshot=>{

        const answer =
          snapshot.val();


        if(
          !answer ||
          !peerConnection
        ){

          return;

        }


        if(
          peerConnection
          .currentRemoteDescription
        ){

          return;

        }


        try{

          await peerConnection.setRemoteDescription(
            new RTCSessionDescription(
              answer
            )
          );

        }catch(error){

          console.error(
            "Voice remote description error:",
            error
          );

        }

      }
    );

}


function watchVoiceCandidates(){

  if(voiceCandidatesListener) return;


  const otherUid =
    myColor === "w"
    ? gameData.blackUid
    : gameData.whiteUid;


  if(!otherUid) return;


  voiceCandidatesListener =
    onValue(
      ref(
        db,
        `games/${currentGameId}/voice/candidates/${otherUid}`
      ),
      snapshot=>{

        const data =
          snapshot.val() || {};


        Object.values(data)
        .forEach(async candidate=>{

          if(!peerConnection){

            return;

          }


          try{

            await peerConnection.addIceCandidate(
              new RTCIceCandidate(
                candidate
              )
            );

          }catch(error){

            console.error(
              "ICE error:",
              error
            );

          }

        });

      }
    );

}


function setupVoiceListeners(){

  /*
    Voice is initialized only when
    the user presses Enable Voice.
  */

  if(
    voiceEnabled &&
    localStream &&
    !peerConnection
  ){

    createPeerConnection();

  }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   INITIAL BOARD
========================================================= */

function showEmptyBoard(){

  const board =
    $("board");

  board.innerHTML = "";

}


showEmptyBoard();


/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
  "visibilitychange",
  ()=>{
    if(!document.hidden){

      updateTimers();

    }
  }
);


</script>
